[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
coverage = "tarpaulin --out Html --output-dir target/tarpaulin --engine llvm"
lint = "clippy --workspace --all-targets -- -D warnings -D clippy::all -W clippy::pedantic"
check-all = "test --workspace && clippy --workspace --all-targets"
audit = "test --workspace && clippy --workspace --all-targets -- -D warnings -D clippy::all -W clippy::pedantic && tarpaulin --out Html --output-dir target/tarpaulin --engine llvm && mutants"

