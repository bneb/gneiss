          <polygon points="256,156 342.6,206 342.6,306 256,356 169.4,306 169.4,206" fill="none" stroke="url(#grad1)" stroke-width="16" stroke-linejoin="round"/>
          
          <circle cx="256" cy="256" r="24" fill="url(#grad2)" />
          
