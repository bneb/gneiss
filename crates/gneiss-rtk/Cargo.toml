[package]
name = "gneiss-rtk"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
chrono = "0.4.45"
gneiss-core.workspace = true
gneiss-geodesy = { version = "0.1.0", path = "../gneiss-geodesy" }
gneiss-parsers = { version = "0.1.0", path = "../gneiss-parsers" }
libm = "0.2.16"
nalgebra = { version = "0.32", default-features = false, features = ["alloc"] }
nalgebra-sparse = "0.9.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
statrs = "0.18.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["gf-slip"]
gf-slip = []           # Geometry-Free cycle slip detection for RTK
doppler-velocity = []  # Doppler-based velocity EKF update for SPP

[dev-dependencies]
tempfile = "3.27.0"
