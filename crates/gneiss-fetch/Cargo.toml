[package]
name = "gneiss-fetch"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.37", features = ["full"] }
gneiss-core = { path = "../gneiss-core" }
flate2 = "1.1.9"
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
