[workspace]
resolver = "2"
members = [
    "crates/*",
    "bin/*",
    "tests"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gemini CLI <gemini@example.com>"]

[workspace.dependencies]
gneiss-core = { path = "crates/gneiss-core" }
gneiss-rtk = { path = "crates/gneiss-rtk" }
gneiss-parsers = { path = "crates/gneiss-parsers" }
gneiss-ntrip = { path = "crates/gneiss-ntrip" }
gneiss-fetch = { path = "crates/gneiss-fetch" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
