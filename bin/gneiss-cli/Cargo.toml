[package]
name = "gneiss-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
gneiss-core.workspace = true
gneiss-rtk.workspace = true
gneiss-parsers.workspace = true
gneiss-ntrip.workspace = true
gneiss-fetch.workspace = true
tokio = { version = "1.37", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
nalgebra = "0.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libm = "0.2.16"
tokio-serial = "5.4.4"
dotenv = "0.15.0"
